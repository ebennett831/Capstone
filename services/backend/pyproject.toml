[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Bennett", email = "ebennett_01@arcadia.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "mediapipe==1.2.2",
    "opencv-contrib-python==5.0.0.93",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "model: requires the locally downloaded official MediaPipe model asset",
]
